<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Math를 활용한 구구단 연습</title>
    <script>
        // 1~9 사이의 정수 난수 리턴
        function randomInt() { 
            return Math.floor(Math.random() * 9) + 1; 
        }
    </script>
</head>
<body>
    <h3>Math를 활용한 구구단 연습</h3>
    <hr>
    <script>
        // 구구단 문제 생성 (예: "3*5")
        let n1 = randomInt();
        let n2 = randomInt();
        let ques = n1 + "*" + n2;
        
        // 사용자로부터 답 입력받기
        let user = prompt(ques + " 값은 얼마입니까?", 0);
        
        if (user == null) { // 취소 버튼이 클릭된 경우
            document.write("구구단 연습을 종료합니다.");
        } else {
            let ans = n1 * n2; // 구구단 정답 계산 (eval 대신 직접 곱셈 계산)
            
            if (parseInt(user) === ans) { // 정답과 사용자 입력 비교 (숫자형으로 변환 후 비교)
                document.write("정답! ");
            } else { 
                document.write("아니오! ");
            }
            
            document.write(ques + " = " + "<strong>" + ans + "</strong> 입니다<br>");
        }
    </script>
</body>
</html>
