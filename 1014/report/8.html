<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Math.random()으로 랜덤한 색 만들기</title>
    <style>
        div {
            display: inline-block;
            width: 150px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h3>16개의 랜덤한 색 만들기</h3>
    <hr>
    <script>
        for (let i = 0; i < 16; i++) {
            // 0 ~ 255 사이의 랜덤 RGB 값 생성
            let r = Math.floor(Math.random() * 256);
            let g = Math.floor(Math.random() * 256);
            let b = Math.floor(Math.random() * 256);
            let color = "rgb(" + r + "," + g + "," + b + ")";

            let str = "<div style='background-color:" + color + "'>" + color + "</div>";
            document.write(str);
        }
    </script>
</body>
</html>
