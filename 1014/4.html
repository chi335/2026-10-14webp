<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Array 객체의 메서드 활용</title>
    <script>
        function pr(msg, arr) { 
            document.write(msg + arr.toString() + "<br>"); 
        }
    </script>
</head>
<body>
    <h3>Array 객체의 메서드 활용</h3>
    <hr>
    <script>
        let a = new Array("황", "김", "이");
        let b = new Array("박");
        let c;

        pr("배열 a = ", a);
        pr("배열 b = ", b);
        document.write("<hr>");

        // 1. concat(): 두 배열을 결합하여 새 배열 리턴 (원본 a는 유지)
        c = a.concat(b); 
        pr("c = a.concat(b) 후 c = ", c);
        pr("c = a.concat(b) 후 a = ", a);

        // 2. join(): 배열의 원소들을 지정한 문자로 연결해 하나의 문자열로 리턴
        c = a.join("##"); 
        pr("c = a.join(\"##\") 후 c = ", c);
        pr("c = a.join(\"##\") 후 a = ", a);

        // 3. reverse(): 배열의 순서를 역순으로 변경 (원본 a가 변경됨)
        c = a.reverse(); 
        pr("c = a.reverse() 후 c = ", c); 
        pr("c = a.reverse() 후 a = ", a);

        // 4. slice(start, end): 지정한 구간의 원소를 추출하여 새 배열 리턴
        c = a.slice(1, 2); 
        pr("c = a.slice(1, 2) 후 c = ", c);
        pr("c = a.slice(1, 2) 후 a = ", a);

        // 5. sort(): 배열을 오름차순으로 정렬 (원본 a가 변경됨)
        c = a.sort(); 
        pr("c = a.sort() 후 c = ", c);
        pr("c = a.sort() 후 a = ", a);

        // 6. toString(): 배열의 원소들을 콤마(,)로 연결한 문자열로 리턴
        c = a.toString(); 
        document.write("a.toString() 결과: " + c);
    </script>
</body>
</html>
